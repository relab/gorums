edition = "2023";

package ordering;
option go_package = "github.com/relab/gorums/internal/tests/ordering";

option features.field_presence = IMPLICIT;

import "gorums.proto";

service Ordering {
    rpc QuorumCall(Request) returns (Response) {
        option (gorums.quorumcall) = true;
    }

    rpc UnaryRPC(Request) returns (Response) {}
}

message Request {
    uint64 num = 1;
}

message Response {
    bool in_order = 1;
}
