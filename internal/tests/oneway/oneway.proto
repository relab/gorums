edition = "2023";

package oneway;
option go_package = "github.com/relab/gorums/internal/tests/oneway";

option features.field_presence = IMPLICIT;

import "gorums.proto";
import "google/protobuf/empty.proto";

service OnewayTest {
    rpc Unicast(Request) returns (google.protobuf.Empty) {
        option (gorums.unicast) = true;
    }
    rpc Multicast(Request) returns (google.protobuf.Empty) {
        option (gorums.multicast) = true;
    }
}

message Request {
    uint64 num = 1;
}
