// Test that Gorums can generate a quorum call method whose message types are
// imported from another package.

edition = "2023";

package internal.testprotos.calltypes.importmsgs;
option go_package = "github.com/relab/gorums/internal/testprotos/calltypes/importmsgs";

option features.field_presence = IMPLICIT;

import "gorums.proto";
import "internal/testprotos/msgs/msgs.proto";

service QuorumCall {
    rpc QuorumCall(msgs.Request) returns (msgs.Response) {
        option (gorums.quorumcall) = true;
    }
}
