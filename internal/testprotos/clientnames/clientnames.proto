// Test that an RPC method may take any Go name, such as Config, WithConfig,
// Node, or ForNode, since the generated clients have no helper methods.

edition = "2023";

package internal.testprotos.clientnames;
option go_package = "github.com/relab/gorums/internal/testprotos/clientnames";

option features.field_presence = IMPLICIT;

import "gorums.proto";

service ClientNames {
    // Config is a quorum call.
    rpc Config(Request) returns (Response) {
        option (gorums.quorumcall) = true;
    }
    // WithConfig is a multicast.
    rpc WithConfig(Request) returns (Response) {
        option (gorums.multicast) = true;
    }
    // Node is a remote call.
    rpc Node(Request) returns (Response) {}
    // ForNode is a unicast.
    rpc ForNode(Request) returns (Response) {
        option (gorums.unicast) = true;
    }
}

message Request {
    string value = 1;
}
message Response {
    int64 result = 1;
}
