// Test that an RPC method may take a Go name that is not a helper method of
// the generated client type, such as Node or ForNode.

edition = "2023";

package internal.testprotos.clientnames;
option go_package = "github.com/relab/gorums/internal/testprotos/clientnames";

option features.field_presence = IMPLICIT;

import "gorums.proto";

service ClientNames {
    // Node is a remote call.
    rpc Node(Request) returns (Response) {}
    // ForNode is a unicast.
    rpc ForNode(Request) returns (Response) {
        option (gorums.unicast) = true;
    }
}

message Request {
    string Value = 1;
}
message Response {
    int64 Result = 1;
}
