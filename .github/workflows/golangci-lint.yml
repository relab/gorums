name: golangci-lint
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Cancel superseded runs of the same pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: "**/go.sum"
      - uses: ./.github/actions/setup-protoc
      - uses: extractions/setup-just@v3

      - name: Build and check generated files
        run: |
          just all
          just check-generated

      # Lints the whole tree with the same version and arguments as just lint,
      # so a clean local run means a clean CI run.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./... ./examples/... ./benchkit/...
