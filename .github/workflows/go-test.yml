name: Go Test
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Cancel superseded runs of the same pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: "**/go.sum"
      - uses: ./.github/actions/setup-protoc
      - uses: extractions/setup-just@v4

      - name: Run Tests
        run: just test

  runtime-race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: "**/go.sum"
      # Run one package at a time to reduce contention during cluster startup under -race.
      - name: Runtime race tests
        run: go test -race -count=1 -p=1 -cpu=1,2,4 . ./internal/impl ./internal/stream ./internal/conn
