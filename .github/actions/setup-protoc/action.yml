name: Setup protoc
description: >
  Installs a pinned protoc release from github.com/protocolbuffers/protobuf
  and verifies the archive against a pinned SHA-256 digest.
  Replaces arduino/setup-protoc, which still targets the deprecated Node.js 20.
inputs:
  version:
    description: >
      protoc version without the leading "v". Only versions with a digest
      below are supported; add the digests when bumping the version. The
      default is the version that generated the committed .pb.go files, so
      code that a workflow regenerates matches them.
    required: false
    default: "36.2"
runs:
  using: composite
  steps:
    - name: Download and install protoc
      shell: bash
      env:
        PROTOC_VERSION: ${{ inputs.version }}
      run: |
        # SHA-256 digests published in the release metadata of each asset.
        case "$PROTOC_VERSION/$RUNNER_OS-$RUNNER_ARCH" in
          36.2/Linux-X64)
            asset="linux-x86_64"
            sha256="121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278" ;;
          36.2/Linux-ARM64)
            asset="linux-aarch_64"
            sha256="8b8f18bd2b30346efbc698dd5a73dd7c805f3ef8380f6dfc95c768f3f1852f6a" ;;
          36.2/macOS-*)
            asset="osx-universal_binary"
            sha256="83d0dc80672f53486f54299bca6177159f9cad1fd54d4d3143eeea53c4423e1b" ;;
          *) echo "no pinned digest for protoc $PROTOC_VERSION on $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        dest="$RUNNER_TEMP/protoc"
        mkdir -p "$dest"
        curl --fail --silent --show-error --location --retry 3 \
          --output "$dest/protoc.zip" \
          "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${asset}.zip"
        echo "$sha256  $dest/protoc.zip" | shasum -a 256 --check --strict -
        unzip -q "$dest/protoc.zip" -d "$dest"
        echo "$dest/bin" >> "$GITHUB_PATH"
        "$dest/bin/protoc" --version
