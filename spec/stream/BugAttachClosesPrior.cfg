\* Module: Stream
\* Expect: violates SlotTracksLive
\* Run: short
\* Bug switch: attaching a stream closes the prior channel. Without a FIFO gate, since the gate refuses the late stream that triggers it.
CONSTANTS
    DCalls = {c1}
    BCalls = {b1}
    QCap = 1
    WireCap = 1
    RecvBuf = 1
    MaxFaults = 1
    MaxGoAways = 0
    AllowCancel = TRUE
    LazyReconnect = FALSE
    AttachClosesPrior = TRUE
    BlockingReplies = FALSE
    Requeue = FALSE
    FIFOGate = "none"
    LateFrames = FALSE
    LostStarts = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    SlotTracksLive

CHECK_DEADLOCK TRUE
