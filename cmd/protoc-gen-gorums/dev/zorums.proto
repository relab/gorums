edition = "2023";

package dev;

option go_package = "cmd/protoc-gen-gorums/dev";

option features.field_presence = IMPLICIT;

import "gorums.proto";
import "google/protobuf/empty.proto";

message Request {
    string value = 1;
    // buf:lint:ignore FIELD_LOWER_SNAKE_CASE
    uint32 ID = 2;
}
message Response {
    int64 result = 1;
}
message MyResponse {
    string value = 1;
}

// ZorumsService is not meant to be implemented.
// The zorums generated code is placed alongside Gorums static code files
// (without the zorums prefix) because they depend on the generated code.
// The generated code must pass compilation, but no further tests are performed.
// Other tests are provided to test the actual generated code.
// The RPCs in this service aims to test various uses of Gorums's
// options and call types, including imported message types and
// multiple RPCs reusing the same input and output types.
service ZorumsService {
    // RemoteCall tests a method without a Gorums option. Gorums generates a
    // remote call for it, which replaces gRPC's unary RPC; no separate
    // _grpc.pb.go file from protoc-gen-go-grpc is needed.
    rpc RemoteCall(Request) returns (Response) {}

    // ---------------------------------------------------------------
    // QuorumCall variants
    // ---------------------------------------------------------------

    // QuorumCall tests a plain quorum call.
    rpc QuorumCall(Request) returns (Response) {
        option (gorums.quorumcall) = true;
    }
    // QuorumCallWithEmptyRequest tests an imported message type as the request.
    rpc QuorumCallWithEmptyRequest(google.protobuf.Empty) returns (Response) {
        option (gorums.quorumcall) = true;
    }
    // QuorumCallWithEmptyResponse tests an imported message type as the response.
    rpc QuorumCallWithEmptyResponse(Request) returns (google.protobuf.Empty) {
        option (gorums.quorumcall) = true;
    }

    // ------------------------------------------------------------------
    // Multicast variants
    // ------------------------------------------------------------------

    // MulticastWithResponse tests a multicast that declares a response type,
    // which a multicast never returns.
    rpc MulticastWithResponse(Request) returns (Response) {
        option (gorums.multicast) = true;
    }
    // MulticastSecondMethod tests multiple multicast methods on one service.
    rpc MulticastSecondMethod(Request) returns (Response) {
        option (gorums.multicast) = true;
    }
    // MulticastWithEmptyResponse tests an imported message type as the response.
    rpc MulticastWithEmptyResponse(Request) returns (google.protobuf.Empty) {
        option (gorums.multicast) = true;
    }
    // MulticastWithEmptyRequestAndResponse tests an imported message type as both
    // request and response.
    rpc MulticastWithEmptyRequestAndResponse(google.protobuf.Empty) returns (google.protobuf.Empty) {
        option (gorums.multicast) = true;
    }

    // ---------------------------------------------------------------
    // Streaming quorum call variants
    // ---------------------------------------------------------------

    // QuorumCallStream tests a plain streaming quorum call.
    rpc QuorumCallStream(Request) returns (stream Response) {
        option (gorums.quorumcall) = true;
    }
    // QuorumCallStreamWithEmptyResponse tests an imported message type as the
    // streamed response.
    rpc QuorumCallStreamWithEmptyResponse(Request) returns (stream google.protobuf.Empty) {
        option (gorums.quorumcall) = true;
    }
    // QuorumCallStreamWithEmptyRequest tests an imported message type as the
    // request, with the same streamed response type as QuorumCallStream.
    rpc QuorumCallStreamWithEmptyRequest(google.protobuf.Empty) returns (stream Response) {
        option (gorums.quorumcall) = true;
    }

    // ---------------------------------------------------------------
    // Unicast
    // ---------------------------------------------------------------

    // Unicast tests a plain unicast.
    rpc Unicast(Request) returns (Response) {
        option (gorums.unicast) = true;
    }

    // UnicastWithEmptyResponse tests an imported message type as the response.
    rpc UnicastWithEmptyResponse(Request) returns (google.protobuf.Empty) {
        option (gorums.unicast) = true;
    }
}
